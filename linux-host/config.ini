# =============================================================================
# config.ini — Modbus Backend 配置文件 v2（多网关）
#
# 【这个文件怎么被读】
#   src/config.c 里的 Config_Load() 逐行解析：
#     · 整行以 # 或 ; 开头 → 注释，跳过
#     · [name]             → 段名（[gateway.N] / [storage] / [log] / [http] / [ota]）
#     · key = value        → 键值对，等号两边空白会被 trim 掉
#
# 【重要易错点：行内注释只在"纯数值行"上安全】
#   config.c 只识别整行注释，**不会**剥离行内注释。
#   数值行之所以能写 `temp_high = 35.0    # 说明`，是因为 atoi/atof 遇到第一个
#   非数字字符就会停下，恰好把 "# 说明" 忽略了 —— 属于"侥幸成立"。
#   而字符串键（host / name / db_path / file）的值是把整行原样取走的，
#   一旦在后面加行内注释，注释会被当成值的一部分写进配置，必然出错。
#   所以：字符串行请把说明写在**上一行**，不要写在行尾。
#
# 热加载支持（无需重启进程）:
#   kill -HUP <pid>     # 运行时重载配置，增/删/改网关即时生效
#   （原理：进程注册了 SIGHUP 处理器 → 重新解析本文件 → 按新网关列表增删采集线程）
# =============================================================================

# ---------------------------------------------------------------------------
# 网关段 [gateway.N]
#   N 从 1 开始连续编号。后端按 N 的顺序管理采集线程，跳过某个 N 可能出边界问题，
#   所以增删网关时建议保持编号连续（tools/test_all.sh 的测试 6 就专门做了重编号）。
#
# 字段说明:
#   host               网关 IP
#   port               Modbus-TCP 端口（标准 502；假网关测试时用 5020+ 高位端口）
#   name               显示名（出现在仪表盘卡片和日志里）
#   interval_sec       采集周期（秒）
#   slave_id           Modbus 从站地址（网关后面挂的串口设备的地址）
#   reg_start          起始寄存器地址（0x0300 = 温度，0x0301 = 湿度）
#   reg_count          连续读取的寄存器个数（本项目读 2 个：温度+湿度）
#   retry_count        单次采集失败后的重试次数
#   retry_interval_ms  重试间隔（毫秒）
#
# 报警阈值（0 = 不启用该通道）:
#   temp_high / temp_low    温度上/下限(℃)
#   hum_high  / hum_low     湿度上/下限(%RH)
#   alarm_debounce          去抖次数：连续 N 次超限才真正触发告警，
#                           避免数据抖动导致告警刷屏
# ---------------------------------------------------------------------------

[gateway.1]
# 一楼温湿度采集（真实网关）
host    = 192.168.10.100
port    = 502
name    = 一楼机房
interval_sec = 5
slave_id     = 1
reg_start    = 0x0300
reg_count    = 2
retry_count  = 3
retry_interval_ms = 1000

# ---- 报警阈值（0 = 不启用该通道） ----
temp_high      = 35.0    # 温度上限 (℃)
temp_low       = 5.0     # 温度下限 (℃)
hum_high       = 90.0    # 湿度上限 (%RH)
hum_low        = 20.0    # 湿度下限 (%RH)
alarm_debounce = 3       # 去抖次数（连续 N 次超限才触发）

