# ---------------------------------------------------------------------------
# 存储段 [storage]
# ---------------------------------------------------------------------------
[storage]
# 数据库文件路径（相对 WorkingDirectory 解析）
db_path = data/modbus_data.db

# 数据保留天数（超过自动清理，0=永久保留）
retain_days = 90

# ---------------------------------------------------------------------------
# 日志段 [log]
# ---------------------------------------------------------------------------
[log]
# 日志级别: DEBUG, INFO, WARN, ERROR（级别越低输出越详细）
level = INFO

# 日志文件路径（空=只输出到终端）
file = data/modbus-backend.log

# 终端输出彩色日志（true/false）
color = true

# ---------------------------------------------------------------------------
# HTTP 段 [http]
# ---------------------------------------------------------------------------
[http]
# HTTP API 端口（访问 http://localhost:8080 看仪表盘）
port = 8080

# ---------------------------------------------------------------------------
# OTA 段 [ota]
# ---------------------------------------------------------------------------
[ota]
# OTA 固件文件存放目录（上传的 .ota 文件会存到这里）
firmware_dir = firmware
# OTA 通信端口（下位机 Bootloader 监听的 TCP 端口）
ota_port = 506
